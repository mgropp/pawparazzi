name: Release debug APK

on:
  push:
    tags: ['v-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v-}" >> "$GITHUB_ENV"

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -PversionName="$VERSION" --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionName="$VERSION" --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/*.apk "pawparazzi-${VERSION}-debug.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: pawparazzi-*-debug.apk
          generate_release_notes: true
